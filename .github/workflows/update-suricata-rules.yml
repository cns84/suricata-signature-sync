name: update-suricata-rules

on:
  workflow_dispatch:

permissions:
  contents: write  # ✅ Enables push access for GITHUB_TOKEN

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true  # ✅ Required for push
          token: ${{ secrets.PAT_TOKEN }}

      # Then later when pushing
      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add rules/combined.rules /tmp/suricata.yaml
          git diff --cached --quiet || git commit -m "Automated update"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/cns84/suricata-signature-sync.git main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch community Suricata rules
        run: python scripts/fetch_rules.py

      - name: Fetch Emerging Threats rules
        run: python scripts/fetch_et_rules.py

      - name: Merge all rules into combined.rules
        run: python scripts/merge_rules.py

      - name: Generate dynamic Suricata config
        run: python scripts/gen_suricata_config.py

      - name: Validate merged Suricata rules
        run: |
          sudo apt-get update
          sudo apt-get install -y suricata
          mkdir -p /tmp/suricata-logs
          suricata -T -c /tmp/suricata.yaml -S rules/combined.rules

      - name: Commit & push updated rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/combined.rules /tmp/suricata.yaml
          git diff --cached --quiet || git commit -m "Automated rules update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin main