# ────────────────────────────────────────────────────────────────
# /etc/corelight/suricata-update/disable.conf
# Disable high-noise or irrelevant ET Pro rules for home use
# ────────────────────────────────────────────────────────────────

# 1. SCADA/ICS protocols (unlikely in home)
2014117   # Modbus TCP Read Request Detected
2014118   # Modbus TCP Write Request Detected
2014120   # DNP3 Read Request

# 2. SMB/NetBIOS (mostly LAN echoes, noisy)
2021473   # SMB Session Setup AndX
2021475   # SMB NT Create AndX
2021477   # NetBIOS Name Query

# 3. Peer-to-Peer / Torrent (no trackers in home)
2010844   # Possible BitTorrent Tracker Announcement
2010845   # Gnutella Query
2010847   # eDonkey Client Handshake

# 4. Host-reputation lists (crowdsourced IPs, often benign)
2014435   # ET PRO Suspicious Source IP Reputation
2014436   # ET PRO Potential Botnet Member

# 5. Port scan / network sweeps (low fidelity in home)
2020079   # ICMP Ping Sweep
2020080   # TCP SYN Scan
2020081   # UDP Port Scan
2020082   # NULL Scan
2020083   # FIN Scan

# 6. HTTP event-decode errors (parsing noise)
2014575   # HTTP Malformed Request
2014576   # HTTP Invalid Method

# 7. DNS INFO & version.bind (benign lookups)
2021015   # DNS TXT ROOT Query
2021016   # DNS Version.bind Query

# 8. TLS warnings & deprecated version use
2021510   # TLS 1.0 Client Hello
2021511   # SSL2/SSL3 Handshake Detected

# 9. IPv6 misc / ND (rare in home, chatty)
2022913   # ICMPv6 Router Advertisement
2022914   # ICMPv6 Neighbor Solicitation

# 10. UPnP Discovery (lots of SSDP chatter)
2023347   # SSDP M-SEARCH
2023348   # SSDP NOTIFY

# ────────────────────────────────────────────────────────────────
# Additional disables
2027397   # Spotify P2P Client
2033078   # Dropbox mDNS Broadcast
# ────────────────────────────────────────────────────────────────
