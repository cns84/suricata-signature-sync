name: update-suricata-rules

on:
  schedule:
    - cron: '0 5,17 * * *'  # Every 12 hours starting at midnight EST (5am & 5pm UTC)
  workflow_dispatch:       # Optional manual trigger

permissions:
  contents: write  # ✅ Enables GITHUB_TOKEN push access if ever needed

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true  # ✅ Required to enable git push
          token: ${{ secrets.PAT_TOKEN }}  # ✅ Use personal access token for secure commits

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests  # ✅ Required by fetch_rules.py
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run preflight check
        run: python scripts/preflight_check.py

      - name: Fetch community Suricata rules
        run: python scripts/fetch_rules.py

      #- name: Discover and fetch Suricata rules
      #  run: python scripts/discover_suricata_feeds.py

      - name: Fetch Emerging Threats rules
        run: python scripts/fetch_et_rules.py

      - name: Merge all rules into combined.rules
        run: python scripts/merge_rules.py

      - name: Post-process merged rules
        run: python scripts/postprocess_rules.py

      - name: Generate dynamic Suricata config
        run: python scripts/gen_suricata_config.py

      - name: Write sync status log
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          RULE_COUNT=$(grep -c "alert " rules/combined.final.rules || echo 0)
          COLLISIONS=$(grep -c "SID " rules/sid_collisions.log || echo 0)
          echo "🕒 Sync Time: $TIMESTAMP" >> rules/sync_status.log
          echo "📦 Final Rule Count: $RULE_COUNT" >> rules/sync_status.log
          echo "🪪 SID Collisions: $COLLISIONS" >> rules/sync_status.log
          echo "✅ Status: Completed" >> rules/sync_status.log

      - name: Update README sync status
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          RULE_COUNT=$(grep -c "alert " rules/combined.final.rules || echo 0)
          COLLISIONS=$(grep -c "SID " rules/sid_collisions.log || echo 0)
          sed -i '/<!-- SYNC_STATUS_BEGIN -->/,/<!-- SYNC_STATUS_END -->/c\
          <!-- SYNC_STATUS_BEGIN -->\
          Last sync: '"$TIMESTAMP"'\
          Rule count: '"$RULE_COUNT"'\
          SID collisions: '"$COLLISIONS"'\
          <!-- SYNC_STATUS_END -->' README.md

      - name: Commit README update
        run: |
          git add README.md
          git commit -m "📘 Sync metadata updated in README: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
          git push

      - name: Commit final rules and sync log
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add rules/combined.final.rules rules/sync_status.log
          git commit -m "🔄 Sync update $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push

      - name: Validate merged Suricata rules
        run: |
          sudo apt-get update
          sudo apt-get install -y suricata
          mkdir -p /tmp/suricata-logs
          suricata -T -c suricata.yaml -S rules/combined.rules  # ✅ Config now generated in repo root

      - name: Commit & push updated rules and config
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add rules/combined.rules suricata.yaml
          git diff --cached --quiet || git commit -m "Automated rules update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/cns84/suricata-signature-sync.git main