name: suricata_signature_update

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  schedule:
    - cron: '0 5,17 * * *'  # Every 12 hours UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests
          sudo apt-get update
          sudo apt-get install -y suricata || echo "Suricata may already be installed"

      - name: Preflight check
        run: python scripts/preflight_check.py || echo "Preflight check failed, continuing"

#      - name: Fetch Suricata feeds (merged)
#        run: python scripts/fetch_suricata_feeds.py

      - name: Discover Suricata feeds (merged)
        run: python scripts/discover_suricata_feeds.py

      - name: Fetch PAW PAT rules
        run: python scripts/fetch_paw_patrules.py

      - name: Merge and post-process rules
        run: |
          python scripts/merge_rules.py
          python scripts/postprocess_rules.py

      - name: Generate Suricata config
        run: python scripts/gen_suricata_config.py

      - name: Validate ruleset
        run: |
          suricata -T -v -c suricata.yaml -S rules/combined.rules 2> rules/suricata_errors.log || true

      - name: Remediate and summarize
        run: python scripts/remediate_and_report.py

      - name: Log sync status
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          FINAL_RULE_COUNT=$(grep -c "alert " rules/combined.final.rules || echo 0)
          echo "🕒 Sync Time: $TIMESTAMP" >> rules/sync_status.log
          echo "📦 Final Rule Count: $FINAL_RULE_COUNT" >> rules/sync_status.log

      - name: Inject sync stats into README
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          COUNT=$(grep -c "alert " rules/combined.final.rules || echo 0)
          sed -i '/<!-- SYNC_STATUS_BEGIN -->/,/<!-- SYNC_STATUS_END -->/c\
          <!-- SYNC_STATUS_BEGIN -->\
          Last sync: '"$TIMESTAMP"'\
          Rule count: '"$COUNT"'\
          <!-- SYNC_STATUS_END -->' README.md || echo "README sync status injection failed"

      - name: Commit updates if changes occurred
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add README.md rules/*.rules rules/sync_status.log suricata.yaml
          git diff --cached --quiet || git commit -m "🔄 Suricata signature update: $TIMESTAMP"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }} main